<!DOCTYPE html>  
<html lang="en">  
<head>  
    <meta charset="UTF-8">  
    <meta name="viewport" content="width=device-width, initial-scale=1.0">  
    <title>Hover Color Change</title>  
    <style>  
        body {  
            display: flex;  
            justify-content: center;  
            align-items: center;  
            height: 100vh;  
            margin: 0;  
            transition: background-color 0.3s ease;  
        }  
        
        .square {  
            width: 100px;  
            height: 100px;  
            margin: 10px;  
            display: inline-block;  
            cursor: pointer;  
            transition: transform 0.2s ease;  
        }  

        .square:hover {  
            transform: scale(1.1);  
        }  

        .square.red { background-color: red; }  
        .square.green { background-color: green; }  
        .square.blue { background-color: blue; }  
        .square.yellow { background-color: yellow; }  
        .square.purple { background-color: purple; }  
    </style>  
</head>  
<body>  
    <div class="square red" onmouseover="changeBackgroundColor('red')" onmouseout="resetBackgroundColor()"></div>  
    <div class="square green" onmouseover="changeBackgroundColor('green')" onmouseout="resetBackgroundColor()"></div>  
    <div class="square blue" onmouseover="changeBackgroundColor('blue')" onmouseout="resetBackgroundColor()"></div>  
    <div class="square yellow" onmouseover="changeBackgroundColor('yellow')" onmouseout="resetBackgroundColor()"></div>  
    <div class="square purple" onmouseover="changeBackgroundColor('purple')" onmouseout="resetBackgroundColor()"></div>  

    <script>  
        function changeBackgroundColor(color) {  
            document.body.style.backgroundColor = color;  
        }  
        
        function resetBackgroundColor() {  
            document.body.style.backgroundColor = '';  
        }  
    </script>  
</body>  
</html>
