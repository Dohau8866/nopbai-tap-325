<!DOCTYPE html>  
<html lang="vi">  
<head>  
    <meta charset="UTF-8">  
    <meta name="viewport" content="width=device-width, initial-scale=1.0">  
    <title>Đăng Nhập</title>  
    <style>  
        body {  
            font-family: Arial, sans-serif;  
            background-color: #f4f4f4;  
            display: flex;  
            justify-content: center;  
            align-items: center;  
            height: 100vh;  
            margin: 0;  
        }  
        .login-container {  
            background: white;  
            padding: 20px;  
            border-radius: 5px;  
            box-shadow: 0 0 10px rgba(0,0,0,0.1);  
        }  
        .form-group {  
            margin-bottom: 15px;  
        }  
        label {  
            display: block;  
            margin-bottom: 5px;  
        }  
        input[type="email"],  
        input[type="password"] {  
            width: 100%;  
            padding: 10px;  
            border: 1px solid #ccc;  
            border-radius: 4px;  
        }  
        .eye-button {  
            cursor: pointer;  
            position: absolute;  
            right: 10px;  
            top: 35px;  
        }  
        button {  
            background-color: #5cb85c;  
            color: white;  
            border: none;  
            padding: 10px;  
            border-radius: 4px;  
            cursor: pointer;  
        }  
    </style>  
</head>  
<body>  

    <div class="login-container">  
        <h2>Đăng Nhập</h2>  
        <form id="loginForm">  
            <div class="form-group">  
                <label for="email">Email:</label>  
                <input type="email" id="email" placeholder="Nhập email của bạn" required>  
            </div>  
            <div class="form-group" style="position: relative;">  
                <label for="password">Mật khẩu:</label>  
                <input type="password" id="password" placeholder="Nhập mật khẩu của bạn" required>  
                <span class="eye-button" id="togglePassword">👁️</span>  
            </div>  
            <button type="submit">Đăng Nhập</button>  
        </form>  
    </div>  

    <script>  
        const loginForm = document.getElementById('loginForm');  
        const emailInput = document.getElementById('email');  
        const passwordInput = document.getElementById('password');  
        const togglePasswordButton = document.getElementById('togglePassword');  

        // Giả lập dữ liệu đăng ký (thay bằng dữ liệu thực tế)  
        const registeredUsers = [  
            { email: 'user@example.com', password: '123456' }  
        ];  

        // Hàm xác thực  
        loginForm.addEventListener('submit', function(event) {  
            event.preventDefault();  
            const email = emailInput.value;  
            const password = passwordInput.value;  

            // Kiểm tra thông tin hợp lệ  
            if (!email) {  
                alert('Email không được để trống.');  
                return;  
            }  

            const user = registeredUsers.find(user => user.email === email && user.password === password);  

            if (user) {  
                alert('Đăng nhập thành công!');  
                // Chuyển trang đến trang chủ  
                window.location.href = 'homepage.html'; // Thay thế bằng trang chủ thực tế  
            } else {  
                alert('Email hoặc mật khẩu không chính xác.');  
            }  
        });  

        // Hàm hiển thị/hide mật khẩu  
        togglePasswordButton.addEventListener('click', () => {  
            const type = passwordInput.type === 'password' ? 'text' : 'password';  
            passwordInput.type = type;  
            togglePasswordButton.textContent = type === 'password' ? '👁️' : '🙈';  
        });  
    </script>  

</body>  
</html>
