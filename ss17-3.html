<!DOCTYPE html>  
<html lang="vi">  

<head>  
    <meta charset="UTF-8">  
    <meta name="viewport" content="width=device-width, initial-scale=1.0">  
    <title>Modal Example</title>  
    <style>  
        body {  
            font-family: Arial, sans-serif;  
        }  

        /* Style cho modal */  
        .modal {  
            display: none; /* Modal mặc định ẩn */  
            position: fixed;   
            z-index: 1; /* Chồng lên tất cả các phần tử khác */  
            left: 0;  
            top: 0;  
            width: 100%;  
            height: 100%;  
            overflow: auto; /* Cho phép cuộn nếu cần thiết */  
            background-color: rgb(0, 0, 0); /* Màn hình nền tối */  
            background-color: rgba(0, 0, 0, 0.4); /* Màu nền tối với độ trong suốt */  
        }  

        /* Style cho nội dung của modal */  
        .modal-content {  
            background-color: #fefefe;  
            margin: 15% auto; /* Đặt cách đều từ trên xuống và vào giữa */  
            padding: 20px;  
            border: 1px solid #888;  
            width: 80%; /* Chiều rộng của modal */  
            text-align: center;  
            border-radius: 5px;  
        }  

        /* Style cho nút đóng */  
        .close {  
            color: #aaa;  
            float: right;  
            font-size: 28px;  
            font-weight: bold;  
        }  

        .close:hover,  
        .close:focus {  
            color: black;  
            text-decoration: none;  
            cursor: pointer;  
        }  
    </style>  
</head>  

<body>  

    <h2>Ví dụ về Modal</h2>  
  
    <!-- Nút để mở modal -->  
    <button id="openModal">Open Modal</button>  

    <!-- Modal -->  
    <div id="myModal" class="modal">  

        <!-- Nội dung modal -->  
        <div class="modal-content">  
            <span class="close">&times;</span>  
            <p>Some text in the modal.</p>  
        </div>  

    </div>  

    <script>  
        // Lấy modal  
        var modal = document.getElementById("myModal");  

        // Lấy nút mở modal  
        var btn = document.getElementById("openModal");  

        // Lấy nút đóng (x)  
        var span = document.getElementsByClassName("close")[0];  

        // Khi người dùng click nút, mở modal  
        btn.onclick = function () {  
            modal.style.display = "block";  
        }  

        // Khi người dùng click nút (x), ẩn modal  
        span.onclick = function () {  
            modal.style.display = "none";  
        }  

        // Khi người dùng click vào màn hình tối, ẩn modal  
        window.onclick = function (event) {  
            if (event.target === modal) {  
                modal.style.display = "none";  
            }  
        }  
    </script>  
    
</body>  

</html>
