<!DOCTYPE html>  
<html lang="vi">  
<head>  
    <meta charset="UTF-8">  
    <meta name="viewport" content="width=device-width, initial-scale=1.0">  
    <title>Bài 1: Thông tin người</title>  
</head>  
<body>  
    <h1>Bài 1: Thông tin người</h1>  
    <script>  
        // Tạo một đối tượng chứa thông tin cá nhân  
        const person = {  
            name: "Nguyễn Văn A",  
            age: 30,  
            address: "Hà Nội, Việt Nam",  
            phone: "0123456789"  
        };  

        // Truy xuất các thuộc tính  
        console.log("Tên:", person.name);  
        console.log("Tuổi:", person.age);  
        console.log("Địa chỉ:", person.address);  
        console.log("Số điện thoại:", person.phone);  
    </script>  
</body>  
</html>
